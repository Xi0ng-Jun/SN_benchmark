[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silicon-notebook-benchmark-deepeval"
version = "0.1.0"
description = "Reproducible RAG benchmark adapters and DeepEval integration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
deepeval = ["deepeval>=4.2,<5"]
dev = ["pytest>=8"]

[project.scripts]
rag-eval = "rag_eval.cli:main"
rag-eval-deepeval = "rag_eval.deepeval_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
rag_eval = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]
