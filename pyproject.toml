[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silicon-notebook-benchmark-deepeval"
version = "0.1.0"
description = "Reproducible RAG benchmark adapters and DeepEval integration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
deepeval = ["deepeval==4.2.2"]
dev = ["pytest>=8", "pytest-xdist>=3", "httpx>=0.27,<1", "requests>=2.32,<3"]
notebook = ["rouge-score==0.1.2"]
workbench = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "packaging>=23"]

[project.scripts]
rag-eval-deepeval = "rag_eval.deepeval_cli:main"
sn-workbench = "rag_eval.workbench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: offline tests that import a real SN checkout (run by default; deselect with -m 'not integration')"]

[tool.setuptools.package-data]
rag_eval = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]
